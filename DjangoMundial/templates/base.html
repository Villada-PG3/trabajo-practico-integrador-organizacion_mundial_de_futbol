<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MundoFútbol | Proyecto Django{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* Variables de la paleta oficial */
        :root {
            --color-fondo: #0F3D2E;
            --color-navbar: #145A32;
            --color-tarjeta: #1E8449;
            --color-dorado: #C8A34D;
            --color-texto: #FFFFFF;
        }

        body {
            background-color: var(--color-fondo) !important;
            color: var(--color-texto);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .bg-navbar {
            background-color: var(--color-navbar) !important;
        }

        .bg-tarjeta {
            background-color: var(--color-tarjeta) !important;
        }

        .text-dorado {
            color: var(--color-dorado) !important;
        }

        .border-dorado {
            border-color: var(--color-dorado) !important;
        }

        /* Botón estilo Dorado */
        .btn-dorado {
            background-color: var(--color-dorado);
            color: #0F3D2E;
            font-weight: 600;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-dorado:hover {
            background-color: #b08d3e;
            color: #ffffff;
        }

        .btn-outline-dorado {
            border: 2px solid var(--color-dorado);
            color: var(--color-dorado);
            font-weight: 600;
        }

        .btn-outline-dorado:hover {
            background-color: var(--color-dorado);
            color: #0F3D2E;
        }

        /* Estilos de navegación */
        .nav-link {
            color: rgba(255, 255, 255, 0.85) !important;
            font-weight: 500;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--color-dorado) !important;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar principal con nombres correspondientes a tu views.py -->
    <nav class="navbar navbar-expand-lg bg-navbar border-bottom border-dorado sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-dorado fs-4" href="{% url 'inicio' %}">
                <i class="fa-solid fa-trophy me-2"></i>MundoFútbol
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars text-dorado fs-3"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'inicio' %}"><i class="fa-solid fa-house me-1"></i> Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mundiales' %}"><i class="fa-solid fa-earth-americas me-1"></i> Mundiales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'selecciones' %}"><i class="fa-solid fa-flag me-1"></i> Selecciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'jugadores' %}"><i class="fa-solid fa-user me-1"></i> Jugadores</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'acerca' %}"><i class="fa-solid fa-circle-info me-1"></i> Acerca de</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-navbar text-white py-3 mt-auto border-top border-dorado">
        <div class="container text-center">
            <p class="mb-0 small text-light">&copy; {% now "Y" %} <span class="text-dorado fw-bold">MundoFútbol</span> — Proyecto Programación. Desarrollado en Django.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
